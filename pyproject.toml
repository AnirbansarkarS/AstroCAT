[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocat"
version = "0.1.0"
description = "Triage companion for NASA/Zooniverse citizen-science projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "pillow",
    "flask",
    "requests",
    "panoptes-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
